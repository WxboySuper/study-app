version: 2
updates:
  # pnpm workspace: one entry at the root covers apps/* and packages/*.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Expo core and its modules must stay on matching SDK patch releases (a
      # lone module bump can need a newer @expo/* peer than the installed
      # `expo` provides), so they always arrive together in one PR.
      expo:
        patterns: ["expo", "expo-*", "@expo/*"]
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # The Expo SDK pins these native modules (see expo/bundledNativeModules.json).
      # Versions outside the SDK's set can break the native build (reanimated 4.7.x
      # only accepts worklets 0.13.x, for example). They move with SDK upgrades:
      # `npx expo install expo@^<sdk> --fix`.
      # Exact pins: no updates at all.
      - dependency-name: "react-native"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-svg"
      # Tilde pins: patches are fine.
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-gesture-handler"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-web"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # A new Expo SDK is a planned upgrade, not a Dependabot PR.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      # Planned migration (docs/SPEC.md, Phase 3): v6 drops Card.elapsed_days,
      # which the local DB, D1 schema and sync protocol store, and changes the
      # default model and fuzzing, so it is not a drop-in bump.
      - dependency-name: "ts-fsrs"
        update-types: ["version-update:semver-major"]
      # Types track the oldest supported Node (engines: >=22), not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # gradle/actions v6 broke Gradle caching in android-release (test run
      # 39867261491: setup-gradle restored nothing, assembleRelease 30m vs ~19m on v4).
      - dependency-name: "gradle/actions"
        update-types: ["version-update:semver-major"]
