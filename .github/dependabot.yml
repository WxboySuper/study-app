version: 2
updates:
  # pnpm workspace: one entry at the root covers apps/* and packages/*.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Reanimated and worklets are pinned as a pair by the Expo SDK (SDK 58:
      # reanimated 4.7.x needs worklets 0.13.x). A lone minor bump breaks the
      # native build; move them with `npx expo install --fix` on SDK upgrades.
      - dependency-name: "react-native-worklets"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-reanimated"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # gradle/actions v6 broke Gradle caching in android-release (test run
      # 39867261491: setup-gradle restored nothing, assembleRelease 30m vs ~19m on v4).
      - dependency-name: "gradle/actions"
        update-types: ["version-update:semver-major"]
