name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Expo web export
        working-directory: apps/mobile
        run: npx expo export -p web --output-dir dist
      - name: Apply D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply cramcritters --remote
      - name: Deploy Worker (API + web)
        working-directory: apps/api
        run: npx wrangler deploy
      - name: Smoke test
        run: |
          curl -fsS https://cramcritters-api.alex-miller-6464.workers.dev/api/health
          curl -fsS -o /dev/null https://cramcritters-api.alex-miller-6464.workers.dev/
