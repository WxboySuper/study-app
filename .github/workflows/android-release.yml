name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Caches ~/.gradle (wrapper, deps, build cache)
      - uses: gradle/actions/setup-gradle@v4

      # node_modules cache on top of the pnpm store cache from setup-node
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Native (C++) compile cache for RN / Hermes / CMake builds
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ndk-arm64
          max-size: 2G

      # ubuntu-latest ships the Android SDK; setup-android@v3 fails installing the removed 'tools' package
      - name: Android SDK env
        run: echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: "1"

      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        # arm64-v8a only -> far less native compile and a much smaller APK
        run: >-
          ./gradlew assembleRelease
          -PreactNativeArchitectures=arm64-v8a
          --build-cache --max-workers=2
          "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx2g
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"

      - name: Sign APK with release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.p12"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          IN="$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -1)"
          VER="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || VER="dev-${GITHUB_SHA::7}"
          OUT="study-app-${VER}.apk"
          "$APKSIGNER" sign --ks "$KS" --ks-type PKCS12 \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$OUT" "$IN"
          "$APKSIGNER" verify --print-certs "$OUT" | head -3
          rm -f "$KS"
          echo "APK=$OUT" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$VER" >/dev/null 2>&1; then
            gh release upload "$VER" "$APK" --clobber
          else
            FLAGS=""; [[ "$GITHUB_REF_TYPE" == tag ]] || FLAGS="--prerelease --target $GITHUB_SHA"
            gh release create "$VER" "$APK" --title "$VER" --generate-notes $FLAGS
          fi
