name: Release on version bump

# Every merge to main that changes the `version` of apps/mobile/app.json gets
# a git tag (v<version>) and an Android build. Without this, a version bump
# only deployed the web app and the API: the APK is built from a `v*` tag and
# the in-app update check reads the latest GitHub release, so phones stayed on
# the old version until someone remembered to tag.
#
# A tag that a workflow pushes with the built-in GITHUB_TOKEN does not start
# other workflows, but a workflow_dispatch does. So this workflow creates the
# tag and then dispatches `android-release.yml` on the tag; that run sees a tag
# ref and publishes a normal (not pre-release) GitHub release, exactly as a
# manual tag push would. A tag pushed by hand still works too.

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/app.json
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-on-version-bump
  cancel-in-progress: false

jobs:
  tag-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Read the app version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/mobile/app.json').expo.version")"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::apps/mobile/app.json version '$VERSION' is not x.y.z"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version is $VERSION (tag v$VERSION)"

      - name: Create the tag and start the Android build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; nothing to release."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          echo "Created tag $TAG at $GITHUB_SHA"
          gh workflow run android-release.yml --ref "$TAG"
          echo "Started the Android release for $TAG"
